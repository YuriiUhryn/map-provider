version: '1.0'

# Offline Map Server - Docker Compose Configuration
# Builds and runs the unified tile generator + tile server
# 
# Build with multiple regions:
# docker-compose build --build-arg OSM_URLS="https://download.geofabrik.de/europe/bulgaria-latest.osm.pbf https://download.geofabrik.de/europe/romania-latest.osm.pbf"
# 
# Or with default Italy:
# docker-compose build

services:
  
  map-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - OSM_URLS=${OSM_URLS:-}
    container_name: map-server
    ports:
      - "8009:8009"
    volumes:
      - ./data:/app/data:ro
      - ./tilemaker:/app/tilemaker:ro
    environment:
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          memory: 8G
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8009"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
